<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<title>Nexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--line:#262626;--tx:#f1eee4;--mut:#8b8b84;--gr:#4ade80;--grd:#10281a;--rd:#e2563b;--am:#f2b441;--cream:#efe9dc;--ink:#111}
[data-theme=light]{--bg:#f6f3ea;--card:#fffdf7;--card2:#efeadc;--line:#ddd6c4;--tx:#16160f;--mut:#6f6e63;--gr:#16a34a;--grd:#dcf3e3;--cream:#16160f;--ink:#f6f3ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;transition:background .4s,color .4s}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(110px + env(safe-area-inset-bottom))}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
header{display:flex;align-items:center;gap:12px;padding:14px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
header .grow{flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;flex:none;cursor:pointer;transition:transform .15s,background .2s}
.ib:active{transform:scale(.88)}
.ib svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{box-shadow:0 0 0 10px rgba(74,222,128,0)}}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:12.5px}.gr{color:var(--gr)}.rd{color:var(--rd)}.am{color:var(--am)}
h2{font-size:18px;margin:18px 0 4px;font-weight:800}
.big{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:8px 0}
.btn{border:0;border-radius:16px;padding:14px 18px;font:700 15px 'Manrope',sans-serif;background:var(--cream);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.g{background:var(--gr);color:#06210f}
.btn.d{background:transparent;color:var(--rd);border:1px solid #5a2a22}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:12px}
.btn.w{width:100%}
.btn svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:11px 16px;border-radius:17px;border:0;background:transparent;color:var(--mut);font:700 14px 'Manrope',sans-serif;cursor:pointer;transition:all .25s}
.tab.on{background:var(--cream);color:var(--ink);transform:scale(1.02)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}
.mini b{display:block;font-size:17px;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:15px;padding:14px;font:500 16px 'Manrope',sans-serif;outline:0;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(74,222,128,.15)}
select.inp{appearance:none}
.quick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 6px 6px 14px;margin:12px 0 6px;transition:border .2s}
.quick:focus-within{border-color:var(--gr)}
.quick input{flex:1;background:transparent;border:0;color:var(--tx);font:500 15px 'Manrope',sans-serif;outline:0;padding:10px 0;min-width:0}
.go{width:42px;height:42px;border-radius:50%;border:1px solid #1f5a35;background:var(--grd);color:var(--gr);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.go:active{transform:scale(.85)}
.go svg{width:19px;height:19px}
.bar{height:8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--gr);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:var(--am)}.bar i.r{background:var(--rd)}
.tx{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,transform .15s}
.tx:active{transform:scale(.98)}
.tx:last-child{border:0}
.tx .t{flex:1;min-width:0}.tx .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{width:46px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:4px 0;flex:none;background:var(--bg)}
.date small{display:block;font:500 10px 'JetBrains Mono';color:var(--mut);letter-spacing:1px}.date b{font-size:19px}
.badge{font:600 10.5px 'JetBrains Mono';padding:4px 8px;border-radius:8px;letter-spacing:.5px}
.b-g{background:var(--grd);color:var(--gr)}.b-a{background:#3a2c0d;color:var(--am)}.b-r{background:#3a1710;color:var(--rd)}.b-m{background:var(--card2);color:var(--mut)}
.alert{display:flex;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;animation:rise .5s both}
.alert .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--card2)}
.alert b{display:block;font-size:14.5px}.alert p{margin:3px 0 6px;font-size:13px;color:var(--mut);line-height:1.4}
.alert a{color:var(--gr);font-weight:700;font-size:13px;cursor:pointer}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;transition:all .25s}
.on .chk,.chk.on{background:var(--gr);border-color:var(--gr);color:#06210f;animation:pop .35s}
.hab{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;cursor:pointer;transition:all .3s;animation:rise .45s both}
.hab.on{background:#173a25;border-color:#1f5a35}
.hab:active{transform:scale(.97)}
.hab b{display:block}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--cream);display:grid;place-items:center;border:0;box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer;z-index:20;animation:pulse 3s infinite;transition:transform .2s}
.fab:active{transform:scale(.88)}
.fab svg{width:30px;height:30px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:sheet .35s cubic-bezier(.2,.8,.2,1)}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;gap:8px}
.seg button{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:700 15px 'Manrope';cursor:pointer;transition:all .2s}
.seg button.on{background:#e86a52;border-color:#e86a52;color:#fff}.seg button.on.in{background:var(--gr);border-color:var(--gr);color:#06210f}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);animation:fade .25s}
.dr{width:min(82%,330px);height:100%;background:var(--card);border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top)) 16px 20px;animation:slideL .3s cubic-bezier(.2,.8,.2,1);overflow:auto}
.dr .it{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;font-weight:600;cursor:pointer;color:var(--tx);transition:all .2s;margin-bottom:2px}
.dr .it.on{background:var(--gr);color:#06210f}.dr .it:active{transform:scale(.96)}
.lab{font:500 10.5px 'JetBrains Mono';letter-spacing:2px;color:var(--mut);margin:16px 12px 6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:13px 18px;border-radius:16px;font-weight:700;z-index:80;display:flex;gap:14px;align-items:center;animation:rise .35s both;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92%}
.toast u{cursor:pointer;color:#0b6b2e}
.chat{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.me{align-self:flex-end;background:var(--cream);color:var(--ink);padding:14px 18px;border-radius:26px;max-width:84%;font-size:16px;line-height:1.45;animation:rise .3s both}
.ai{display:flex;gap:12px;font-size:16px;line-height:1.55;animation:rise .4s both}
.ai b{background:rgba(74,222,128,.18);border-bottom:2px solid rgba(74,222,128,.5)}
.chatbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:30}
.chatbar>div{max-width:520px;margin:auto}
.sug{display:flex;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .15s}
.sug:active{transform:scale(.97)}
.sw{width:50px;height:30px;border-radius:30px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .25s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:all .25s}
.sw.on{background:var(--gr)}.sw.on::after{left:23px;background:#06210f}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{padding:9px 0;border-radius:12px;font-weight:600;cursor:pointer;position:relative;transition:all .2s}
.cal span.h{color:var(--mut);font:500 11px 'JetBrains Mono';cursor:default}
.cal span.on{background:var(--cream);color:var(--ink)}.cal span.td{border:1px solid var(--gr)}
.cal span i{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gr)}
.spark{width:100%;height:80px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--mut)}
.bars i{width:100%;border-radius:6px 6px 2px 2px;transition:height 1s cubic-bezier(.2,.8,.2,1);height:0}
.cnq{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cnq.off{opacity:.4;filter:grayscale(1)}
.empty{text-align:center;color:var(--mut);padding:20px 8px;font-size:14px}

body{font-size:14px}
#app{padding-left:14px;padding-right:14px}
header{padding:10px 0 12px;gap:10px;margin-bottom:12px}
header h1{font-size:22px;letter-spacing:-.4px}
header p{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px}
.ib svg{width:17px;height:17px}
.card{padding:14px;border-radius:18px;margin-bottom:10px}
.big{font-size:32px;margin:6px 0 4px}
h2{font-size:17px}
.btn{padding:12px 16px;font-size:14px;border-radius:14px}
.btn.sm{padding:8px 12px;font-size:12.5px}
.tabs{padding:4px;border-radius:20px}
.tab{padding:9px 14px;font-size:13px;display:inline-flex;align-items:center;gap:7px;border-radius:16px}
.tab svg{width:15px;height:15px}
.inp{padding:12px 14px;font-size:15px;border-radius:14px}
.tx b{font-size:14px}
.sheet{padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:19px}
.mini{padding:10px 12px;border-radius:14px}.mini b{font-size:15px}
.me,.ai{font-size:15px}
.quick{border-radius:18px}
.btn,.ib,.tab,.hab,.tx,.sug,.go,.dr .it,.seg button,.crow{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn:not(.o):not(.d) .ripple{background:rgba(0,0,0,.14)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.pg{animation:pg .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tx,.crow,.alert,.hab{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.tx:nth-child(2){animation-delay:.03s}.tx:nth-child(3){animation-delay:.06s}.tx:nth-child(4){animation-delay:.09s}.tx:nth-child(5){animation-delay:.12s}.tx:nth-child(n+6){animation-delay:.15s}
.alert:nth-of-type(2){animation-delay:.05s}.alert:nth-of-type(3){animation-delay:.1s}
.btn:hover,.card[data-a]:hover{filter:brightness(1.06)}
.card[data-a]{transition:transform .2s}.card[data-a]:active{transform:scale(.98)}
.tab{transition:all .3s cubic-bezier(.2,.8,.2,1)}
.tab:active{transform:scale(.93)}
.accent{position:absolute;top:-1px;left:22px;width:70px;height:4px;border-radius:0 0 4px 4px;background:var(--gr)}
.row .mut svg,.ib svg{flex:none}
.cc{border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;animation:rise .5s both}
.cc::after{content:'';position:absolute;right:-70px;bottom:-100px;width:270px;height:270px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.ct{font-size:19px;font-weight:800;letter-spacing:-.4px}.cs{font-size:13px;opacity:.8}
.cv{font-size:32px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px}
.cbar{height:8px;border-radius:8px;background:rgba(0,0,0,.3);margin-bottom:10px;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:#fff;border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.glass{background:rgba(0,0,0,.25)!important;border-color:rgba(255,255,255,.18)!important;color:#fff!important}
.bar i.g2{background:linear-gradient(90deg,#f2b441,#ff8a6b)}
.badge.b-b{background:#1e2a4a;color:#7fa6ff}
.infobox{display:flex;gap:10px;padding:12px;border-radius:14px;background:#1c2233;border:1px solid #2c3a63;color:var(--mut);font-size:13.5px;line-height:1.45;margin-bottom:12px}
.infobox svg{width:18px;height:18px;flex:none;color:#8aa4e6}
.crow{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);margin-bottom:8px}
.cseg button.on,.cseg button.on.in{background:#14281c;border-color:var(--gr);color:var(--gr)}
.alert .i.rd{color:var(--rd);background:#2e1511}.alert .i.am{color:var(--am);background:#2e2410}.alert .i svg{width:18px;height:18px}
.hl{display:flex;align-items:center;gap:8px;color:var(--gr);font-weight:700;font-size:14px;margin:0 0 12px;cursor:pointer;transition:transform .2s}.hl:active{transform:scale(.96)}.hl svg{width:18px;height:18px}
.cal{gap:2px 0}.cal span{padding:12px 0;font-size:15px;font-weight:500}
.cal span.h{font:500 11px 'JetBrains Mono';letter-spacing:1.5px;padding:8px 0;color:var(--mut)}
.cal span.on{background:var(--cream);color:var(--ink);font-weight:800;border-radius:14px;animation:pop .3s}
.cal span.td{border:0;color:var(--gr)}.cal span.on.td{color:var(--ink)}
.cal span i{display:none}
.cal s{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:3px;text-decoration:none}
.cal s b{width:5px;height:5px;border-radius:50%;background:#7c8cff}.cal s.g3 b{background:var(--am)}
.lg{display:flex;align-items:center;gap:3px}.lg b{width:5px;height:5px;border-radius:50%}.lg em{font-style:normal;margin-left:4px}
.dr{display:flex;flex-direction:column}

.dr .it svg{width:20px;height:20px;flex:none}
.dr .asst{border:1px solid var(--line);border-radius:16px;margin-bottom:4px}
.dr .sub{margin-left:22px;border-left:1px solid var(--line);padding-left:6px}
.dr .sub .it{color:var(--mut);padding:9px 10px;font-size:14px}.dr .sub .it.on{color:#06210f}
.cnt{margin-left:auto;font:500 13px 'JetBrains Mono';font-style:normal;color:var(--mut)}.it.on .cnt{color:#06210f}
.dr .spacer{flex:1;min-height:20px}
.plan{border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}.plan b{display:block}.plan span{font-size:13px;color:var(--mut)}

.foot i{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--gr)}
.acc{border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden;background:var(--bg)}
.acc .h{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.acc .h svg{width:19px;height:19px;color:var(--gr);flex:none}
.acc .h svg.ch{margin-left:auto;color:var(--mut);transition:transform .3s}
.acc .b{max-height:0;overflow:hidden;transition:max-height .45s ease,padding .3s;padding:0 14px;color:var(--mut);font-size:13.5px;line-height:1.55}
.acc.on .b{max-height:320px;padding:0 14px 14px}.acc.on .ch{transform:rotate(180deg)}

<script>
'use strict';
/* ===== utilidades ===== */
const KEY='nexo_data_v2';
const VERSION='v6';
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};

/* ===== cálculos ===== */
const cat=n=>S.cats.find(c=>c.n===n)||{n,c:'#8b8b84',t:'out'};
function balanceAt(d){let b=0;S.tx.forEach(t=>{if(t.date<=d)b+=t.type==='in'?t.amount:-t.amount});return r2(b)}
const balance=()=>balanceAt(today());
const txMonth=ym=>S.tx.filter(t=>ymOf(t.date)===ym);
const sumT=(l,ty)=>r2(l.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0));
function invBase(c,p){return ymAdd(ymOf(p.date),dayN(p.date)>c.close?1:0)}
function cardInv(c,ym){let t=0;S.purch.filter(p=>p.card===c.id).forEach(p=>{const b=invBase(c,p);for(let k=0;k<p.n;k++)if(ymAdd(b,k)===ym)t+=p.amount/p.n});return r2(t)}
function cardMonths(c){const s=new Set();S.purch.filter(p=>p.card===c.id).forEach(p=>{const b=invBase(c,p);for(let k=0;k<p.n;k++)s.add(ymAdd(b,k))});return [...s].sort()}
const cardDue=(c,ym)=>c.due>c.close?dueDate(ym,c.due):dueDate(ymAdd(ym,1),c.due);
const invPaid=(c,ym)=>!!S.paid['c'+c.id+':'+ym];
function cardUsed(c){return r2(cardMonths(c).filter(m=>!invPaid(c,m)).reduce((a,m)=>a+cardInv(c,m),0))}
function billsOf(ym){return S.bills.filter(b=>b.rep==='month'?(ym>=b.start&&(!b.months||ym<ymAdd(b.start,b.months))):ymOf(b.date)===ym).map(b=>({b,date:b.rep==='month'?dueDate(ym,b.day):b.date,paid:!!S.paid['b'+b.id+':'+ym],key:'b'+b.id+':'+ym}))}
function invoicesDue(ym){const r=[];S.cards.forEach(c=>cardMonths(c).forEach(m=>{const d=cardDue(c,m);if(ymOf(d)===ym){const v=cardInv(c,m);if(v>0)r.push({c,m,date:d,v,paid:invPaid(c,m)})}}));return r}
function pending(ym){let t=0;const td=today();billsOf(ym).forEach(x=>{if(!x.paid)t+=x.b.amount});invoicesDue(ym).forEach(x=>{if(!x.paid)t+=x.v});return r2(t)}
function spentCat(n,ym){let t=sumT(txMonth(ym).filter(x=>x.cat===n),'out');S.purch.filter(p=>p.cat===n).forEach(p=>{for(let k=0;k<p.n;k++)if(ymAdd(ymOf(p.date),k)===ym)t+=p.amount/p.n});return r2(t)}
function forecast(){const ym=today().slice(0,7),td=today(),d=new Date().getDate(),dm=dpm(ym);const m=txMonth(ym).filter(t=>t.type==='out'&&t.date<=td);const sm=l=>r2(l.reduce((a,t)=>a+t.amount,0));const outs=sm(m);const varOut=sm(m.filter(t=>!(t.ref&&/^[bc]/.test(t.ref))&&t.cat!=='Reserva'&&t.desc!=='Ajuste de saldo'));const fixed=r2(billsOf(ym).reduce((a,x)=>a+x.b.amount,0)+invoicesDue(ym).reduce((a,x)=>a+x.v,0));return{proj:r2(varOut/d*dm+fixed),outs}}
const streak=h=>{let d=new Date(),n=0;if(!h.log.includes(iso(d)))d.setDate(d.getDate()-1);while(h.log.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n};

   else if(f.type==='money')inner=`<input class="inp mono" id="f_${f.k}" inputmode="numeric">`;

   w.innerHTML=(f.label?`<label>${f.label}</label>`:'')+inner;
  }
  mf.appendChild(w);

 });

 $('#mc').onclick=closeLayer;$('.ov').onclick=e=>{if(e.target.classList.contains('ov'))closeLayer()};
 $('#ms').onclick=()=>{const v=get();if(onSave(v)!==false){closeLayer()}};
 if(o.del)$('#md').onclick=()=>{o.del();closeLayer()};
 if(o.after)o.after();
 const first=$('.inp:not(.mono)',mf);
}

 ],v=>{if(!v.amount){toast('Informe o valor');return false}

function parseVal(l){const m=l.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(mil\b|k\b)?/);if(!m)return null;let s=m[1];if(/\.\d{3}/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');let v=parseFloat(s);if(m[2])v*=1000;return isNaN(v)?null:{v:r2(v),i:m.index,len:m[0].length}}
const CATKW={Mercado:'mercado supermercado feira atacadao',Transporte:'uber 99 gasolina onibus metro combustivel estacionamento pedagio passagem',Delivery:'ifood delivery pizza lanche hamburguer rappi',Luz:'luz energia',Água:'agua saneamento',Moradia:'aluguel condominio iptu',Assinaturas:'netflix spotify assinatura prime disney youtube',Roupas:'roupa tenis camisa calca sapato vestido',Saúde:'farmacia remedio medico consulta dentista plano de saude',Lazer:'cinema bar festa show balada jogo viagem',Alimentação:'restaurante almoco jantar comida cafe padaria',Salário:'salario pagamento holerite'};
function guessCat(l,ty){for(const c of S.cats){if(l.includes(norm(c.n)))return c.n}for(const k in CATKW){if(CATKW[k].split(' ').some(w=>w.length>2?l.includes(w):false))return S.cats.some(c=>c.n===k)?k:'Outros'}return ty==='in'?'Salário':'Outros'}
function parseWhen(l){let date=today();if(/depois de amanha/.test(l))date=addDays(date,2);else if(/amanha/.test(l))date=addDays(date,1);else{const m=l.match(/dia (\d{1,2})/);if(m){const d=+m[1];let ym=today().slice(0,7);if(d<+today().slice(8))ym=ymAdd(ym,1);date=dueDate(ym,d)}else{for(let i=0;i<7;i++){const t=addDays(today(),i);if(l.includes(norm(dowOf(t)))&&i>0){date=t;break}}}}
 let time='09:00';const m=l.match(/(?:as|a|às)\s*(\d{1,2})(?:[:h](\d{2}))?/)||l.match(/(\d{1,2})[:h](\d{2})/);if(m)time=pad(+m[1])+':'+pad(+(m[2]||0));return{date,time}}
const FAQ=[
 [/(notific|alerta|avis|lembr)/,'O Nexo avisa sozinho: conta ou fatura vencendo (no dia e na véspera), limite de gasto perto, meta alcançada, saldo que pode não cobrir o mês, compromissos e o resumo da semana. Ajuste tudo em <b>Configurações → Notificações</b> e toque em <b>Ativar notificações</b> uma vez.'],

function assist(text){
 const l=norm(text),val=parseVal(l);
 if(/(tarefa)/.test(l)){const t=text.replace(/^.*?tarefa\s*(de|para|:)?\s*/i,'').trim()||text;S.tasks.push({id:uid(),t,done:false});return `Tarefa criada: <b>${esc(t)}</b>.`}
 if(/(reuniao|compromisso|consulta|marca|agenda|dentista|medico).*(\d)/.test(l)&&!/(gastei|paguei)/.test(l)){const w=parseWhen(l);const t=text.replace(/\s*(às?\s*\d{1,2}([:h]\d{2})?|\d{1,2}[:h]\d{2})/i,'').replace(/\s*(depois de amanh[ãa]|amanh[ãa]|\bhoje)/i,'').trim()||text;S.events.push({id:uid(),title:t[0].toUpperCase()+t.slice(1),date:w.date,time:w.time,place:''});return `Pronto: <b>${esc(t)}</b> na agenda, <b>${w.date.split('-').reverse().slice(0,2).join('/')}</b> às <b>${w.time}</b>.`}
 if(val&&/(guarda|guardar|separa|separar|poupa|reserva)/.test(l)){let g=S.goals.find(x=>l.includes(norm(x.name).split(' ')[0]))||S.goals.find(x=>/reserva/.test(norm(x.name)))||S.goals[0];
  if(!g){g={id:uid(),name:'Reserva de emergência',target:10000,saved:0,date:''};S.goals.push(g)}
  g.saved=r2(g.saved+val.v);S.tx.push({id:uid(),type:'out',amount:val.v,cat:'Reserva',date:today(),desc:'Guardado: '+g.name});return `Pronto: <b>${money(val.v)}</b> guardados em <b>${esc(g.name)}</b>. Agora são <b>${money(g.saved)}</b> de <b>${money(g.target)}</b>.`}
 if(val&&/(recebi|ganhei|caiu|entrou|receita|salario|vendi|registre.*(ganhei|recebi))/.test(l)){let d=text.slice(0,val.i)+text.slice(val.i+val.len);d=d.replace(/(registre|anota|lan[cç]a|recebi|ganhei|caiu|entrou|que|agora|o|um|de|reais|real)\b/gi,' ').replace(/\s+/g,' ').trim();const c=guessCat(l,'in');S.tx.push({id:uid(),type:'in',amount:val.v,cat:c,date:today(),desc:d});return `Registrei uma receita de <b>${money(val.v)}</b>${d?' ('+esc(d)+')':''} em <b>${esc(c)}</b>. Saldo agora: <b>${money(balance())}</b>.`}
 if(val&&/(gastei|paguei|comprei|gasto|compra|saiu|debitou|despesa|registre|anota|lanca|lance)/.test(l)){let d=text.slice(0,val.i)+text.slice(val.i+val.len);d=d.replace(/(gastei|paguei|comprei|registre|anota|lan[cç]a|lance|reais|real|despesa|um|uma)\b/gi,' ').replace(/^\s*(de|no|na|em|com|pra|para)\s+/i,'').replace(/\s+/g,' ').trim();const c=guessCat(l,'out');S.tx.push({id:uid(),type:'out',amount:val.v,cat:c,date:today(),desc:d});return `Registrei uma despesa de <b>${money(val.v)}</b>${d?' ('+esc(d)+')':''} em <b>${esc(c)}</b>. Saldo agora: <b>${money(balance())}</b>.`}
 if(/saldo/.test(l))return `Seu saldo disponível hoje é <b>${money(balance())}</b>.`;
 if(/(quanto).*(gastei|gasto)/.test(l)){const ym=today().slice(0,7);return `Em ${MES[+ym.slice(5)-1]} você gastou <b>${money(sumT(txMonth(ym),'out'))}</b> e recebeu <b>${money(sumT(txMonth(ym),'in'))}</b>.`}
 if(/(o que|quais).*(pagar|vence)|contas a pagar/.test(l)){const ym=today().slice(0,7),p=pending(ym);return p?`Faltam <b>${money(p)}</b> em contas e faturas para pagar em ${MES[+ym.slice(5)-1]}.`:'Nada pendente este mês.'}
 for(const [re,a] of FAQ)if(re.test(l))return a;
 return 'Não entendi bem, '+S.set.name+'. Posso registrar gastos e receitas (<b>gastei 45 no mercado</b>), guardar em metas, criar tarefas e compromissos, ou tirar dúvidas do app.';
}

function voice(cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voz não disponível aqui. Use o microfone do teclado.');return}

};
V.agenda=()=>{const sel=S.ui.agDate,ym=sel.slice(0,7),first=new Date(ym+'-01T12:00:00').getDay(),dm=dpm(ym),td=today();
 let cells=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<span class="h">${x}</span>`).join('')+'<span></span>'.repeat(first);

 const ev=S.events.filter(e=>e.date===sel).sort((a,b)=>a.time<b.time?-1:1),nx=S.events.filter(e=>e.date>td&&e.date<=addDays(td,14)).sort((a,b)=>a.date+a.time<b.date+b.time?-1:1).slice(0,6);
 const cap=x=>x[0].toUpperCase()+x.slice(1),mn=cap(MES[+ym.slice(5)-1]);

 const ls=txt.split(/\r?\n/).filter(l=>l.trim());if(!ls.length)return rows;
 const sep=(ls[0].match(/;/g)||[]).length>=(ls[0].match(/,/g)||[]).length?';':',';

 const hasH=di>=0&&vi>=0;if(!hasH){di=0;ei=1;vi=2}
 ls.slice(hasH?1:0).forEach(l=>{const c=sp(l);let d=c[di]||'';const m=d.match(/(\d{2})\/(\d{2})\/(\d{4})/);d=m?m[3]+'-'+m[2]+'-'+m[1]:(d.match(/^\d{4}-\d{2}-\d{2}/)||[''])[0];

 prodadd(){prodModal()},prodedit(d){prodModal(byId(S.biz.prods,d.id))},saleadd(){saleModal()},
 sug(d){if(/tarefa/i.test(d.t)){A.taskadd();return}const m={'Como organizar meu dinheiro no mês?':'como funciona limite categoria','O que tenho na agenda hoje?':null,'Como está minha rotina?':null}[d.t];
  if(d.t.startsWith('O que tenho')){const ev=S.events.filter(e=>e.date===today());S.chat.push({r:'u',t:d.t},{r:'a',t:ev.length?'Hoje: '+ev.map(e=>`<b>${esc(e.title)}</b> às ${e.time}`).join(', ')+'.':'Você não tem compromissos hoje.'})}
  else if(d.t.startsWith('Como está')){const n=S.habits.filter(h=>h.log.includes(today())).length;S.chat.push({r:'u',t:d.t},{r:'a',t:`Hoje você marcou <b>${n} de ${S.habits.length}</b> hábitos.`+(S.habits.length?' Maior sequência: <b>'+Math.max(...S.habits.map(streak))+' dias</b>.':'')})}
  else S.chat.push({r:'u',t:d.t},{r:'a',t:'Comece pelo básico: lance suas entradas e saídas (ou fale comigo: <b>gastei 45 no mercado</b>), cadastre as contas fixas em <b>Financeiro → Contas</b> e defina limites por categoria em <b>Limites</b>. Assim eu aviso antes de o dinheiro faltar.'});

  const u=snapUndo();let n=0;
  RX.rows.forEach(r=>{const c=guessCat(norm(r.desc),r.v>0?'in':'out');
   if(fat){if(r.v<=0)return;S.purch.push({id:uid(),card:RX.card,amount:r2(r.v),n:1,cat:c,date:r.date,desc:r.desc});n++}

/* ===== notificações ===== */
function notify(title,body,tag){if(!('Notification' in window)||Notification.permission!=='granted')return;
 const o={body,tag,icon:ICON,badge:ICON};
 if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});else try{new Notification(title,o)}catch(e){}}
function once(k,t,b){if(S.notified[k])return;S.notified[k]=1;const ks=Object.keys(S.notified);if(ks.length>400)ks.slice(0,150).forEach(x=>delete S.notified[x]);save();notify(t,b,k)}
function checkAlerts(){if(!('Notification' in window)||Notification.permission!=='granted')return;
 const now=new Date(),td=today(),tm=addDays(td,1),hm=pad(now.getHours())+':'+pad(now.getMinutes()),ym=td.slice(0,7),s=S.set;
 if(s.nBills){[ym,ymAdd(ym,1)].forEach(m=>{billsOf(m).forEach(x=>{if(x.paid)return;if(x.date===td)once('bt'+x.key,'Conta de '+x.b.name+' vence hoje',money(x.b.amount)+'. Já pagou?');else if(x.date===tm)once('bm'+x.key,'Conta de '+x.b.name+' vence amanhã',money(x.b.amount)+'. Já separou o valor?');else if(x.date<td&&x.date>=addDays(td,-3))once('bl'+x.key,'Conta de '+x.b.name+' atrasada',money(x.b.amount)+' venceu dia '+dayN(x.date)+'.')});invoicesDue(m).forEach(x=>{if(x.paid)return;const k='c'+x.c.id+x.m;if(x.date===td)once('it'+k,'Fatura do cartão vence hoje',x.c.name+' · valor a pagar: '+money(x.v)+'.');else if(x.date===tm)once('im'+k,'Fatura do Cartão vence amanhã',x.c.name+' · valor a pagar: '+money(x.v)+'.')})})}
 if(s.nCoach){S.limits.forEach(l=>{const p=spentCat(l.cat,ym)/l.amount;if(p>=1)once('l1'+l.id+ym,l.cat+' estourou o limite','Você passou do limite de gasto de '+l.cat+' neste mês.');else if(p>=.8)once('l8'+l.id+ym,l.cat+' perto do limite','Você já usou '+Math.floor(p*100)+'% do limite de gasto de '+l.cat+' neste mês.')});
  const left=balance()-pending(ym);if(balance()>=0&&forecast().outs>0&&left<0)once('fc'+ym+Math.floor(now.getDate()/7),'O saldo pode não cobrir o mês','Depois das contas e faturas que vencem até o fim do mês, faltariam '+money(Math.abs(left))+'.')}
 if(s.nGoals){S.goals.forEach(g=>{if(g.saved>=g.target)once('g'+g.id,'Você alcançou seu objetivo: '+g.name,'Você juntou '+money(g.saved)+' para essa meta. Boa!')});S.sg.forEach(q=>{const h=byId(S.habits,q.h);if(h&&streak(h)>=q.d)once('s'+q.id,'Você conseguiu: '+h.t,'Sequência de '+q.d+' dias cumprida!')})}
 if(s.daily&&hm>=s.dailyTime){const ev=S.events.filter(e=>e.date===td).length,tk=S.tasks.filter(t=>!t.done).length,hb=S.habits.filter(h=>!h.log.includes(td)).length;once('d'+td,greet()+', '+call(),(ev?ev+' compromisso(s) hoje. ':'')+tk+' tarefa(s) e '+hb+' hábito(s) pendentes.')}
 if(s.nWeek&&now.getDay()===1&&hm>='09:00'){const wk=S.tx.filter(t=>t.date>=addDays(td,-7));once('w'+td,'Seu resumo semanal','Entradas '+money(sumT(wk,'in'))+' · saídas '+money(sumT(wk,'out'))+'. Seu assistente pessoal.')}
 if(s.lead>0)S.events.forEach(e=>{if(e.date!==td)return;const t=new Date(td+'T'+e.time+':00'),df=(t-now)/6e4;if(df<=s.lead&&df>-5)once('e'+e.id+td,e.title+(df>1?' em '+Math.round(df)+' min':' agora'),(e.place?e.place+' · ':'')+e.time)});
}

(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0a0a0a';x.fillRect(0,0,180,180);const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#4ade80');g.addColorStop(1,'#22d3a6');x.strokeStyle=g;x.lineWidth=24;x.lineCap=x.lineJoin='round';x.beginPath();x.moveTo(45,138);x.lineTo(45,52);x.lineTo(135,128);x.lineTo(135,42);x.stroke();x.fillStyle='#4ade80';x.beginPath();x.arc(150,30,9,0,7);x.fill();
